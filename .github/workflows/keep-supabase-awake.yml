name: Keep Supabase awake

# Supabase pausa los proyectos del plan gratuito tras ~7 días sin actividad en la
# base de datos. Una lectura por PostgREST no bastó (se pausó igual), así que este
# workflow llama todos los días a keepalive_touch(), que ESCRIBE una marca de tiempo
# (ver supabase/migrations/0039_keepalive.sql). Requiere los secrets del repo
# SUPABASE_URL y SUPABASE_ANON_KEY.
on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC = 8:00 am hora Colombia, todos los días
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Latido a Supabase (escritura en la base)
        run: |
          status=$(curl -s -o /tmp/body.txt -w "%{http_code}" -X POST \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive_touch" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase respondió HTTP $status"
          cat /tmp/body.txt
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase respondió con un error ($status) -- ¿corriste la migración 0039 y están bien los secrets SUPABASE_URL/SUPABASE_ANON_KEY?"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
